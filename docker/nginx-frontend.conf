# ==========================================
# Nginx config — React SPA Production
# SSL enabled when /etc/nginx/ssl/{cert,key}.pem exist
# ==========================================

# HTTPS server (active when SSL certs are mounted)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # If cert files don't exist, nginx skips this block gracefully

    # Docker internal DNS — runtime resolution
    resolver 127.0.0.11 valid=30s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;
    gzip on; gzip_vary on; gzip_proxied any; gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss image/svg+xml;
    include /etc/nginx/conf.d/security-headers.conf;

    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Proxy rules (same as HTTP below) ──
    location /api/v1/invites         { set $u auth:8081; proxy_pass http://$u; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
    location /api/v1/admin/          { set $u auth:8081; proxy_pass http://$u; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
    location /api/v1/auth/           { set $u auth:8081; if ($request_method = 'OPTIONS') { add_header Access-Control-Allow-Origin "$http_origin" always; add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,PATCH,OPTIONS" always; add_header Access-Control-Allow-Headers "Authorization,Content-Type,X-Requested-With,Accept" always; add_header Access-Control-Allow-Credentials "true" always; add_header Access-Control-Max-Age 3600 always; add_header Content-Length 0; return 204; } proxy_pass http://$u; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
location ~ ^/api/v1/(ai|redmine|mcp) { default_type application/json; return 404 '{"code": "ai_unavailable", "message": "AI features are not included in this open-source edition. See the README Enterprise section to enable the licensed ai-brain."}';
    }
    location /api/v1/activity        { set $u core:8082; proxy_pass http://$u; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
    location /api/v1/reports         { set $u core:8082; proxy_pass http://$u; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 300s; }
    location /api/                   { set $u core:8082; proxy_pass http://$u; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; proxy_read_timeout 300s; }
    location /ws                     { set $u core:8082; proxy_pass http://$u; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_read_timeout 86400s; }
    location / {
        try_files $uri $uri/ /index.html;
        expires -1; etag off; if_modified_since off;
        add_header Last-Modified ""; add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate"; add_header Pragma "no-cache";
    }
}

# HTTP server — redirect to HTTPS when SSL is configured, or serve directly
server {
    listen 80;          # IPv4
    listen [::]:80;     # IPv6 (ignored if not available)
    server_name _;

    # Docker internal DNS — runtime resolution so nginx starts even if
    # upstream containers are temporarily down. Using variables in proxy_pass
    # forces re-resolution on every request instead of at startup.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Root: compiled static files
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression (reduce transfer by 70%+)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               image/svg+xml;

    # Security headers
    include /etc/nginx/conf.d/security-headers.conf;

    # Health check endpoint
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Static assets with cache busting (hashed filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Invite lookup (public, no auth required) → auth service
    location /api/v1/invites {
        set $upstream_auth auth:8081;
        proxy_pass http://$upstream_auth;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin endpoints (SMTP, member approval) → auth service
    location /api/v1/admin/ {
        set $upstream_auth auth:8081;
        proxy_pass http://$upstream_auth;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auth endpoints → auth service
    location /api/v1/auth/ {
        set $upstream_auth auth:8081;
        # Handle CORS preflight (Spring Security blocks OPTIONS by default)
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "$http_origin" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age 3600 always;
            add_header Content-Length 0;
            return 204;
        }
        proxy_pass http://$upstream_auth;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # AI endpoints → ai-brain (SSE streaming)
location ~ ^/api/v1/(ai|redmine|mcp) { default_type application/json; return 404 '{"code": "ai_unavailable", "message": "AI features are not included in this open-source edition. See the README Enterprise section to enable the licensed ai-brain."}';
    }

    # Redmine plugin → ai-brain (sync trigger + project summary)

    # MCP → ai-brain  (Claude Code integration)

    # Activity feed → core
    location /api/v1/activity {
        set $upstream_core core:8082;
        proxy_pass http://$upstream_core;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reports CRUD → core (AI review goes to ai-brain via /api/v1/ai/ route)
    location /api/v1/reports {
        set $upstream_core core:8082;
        proxy_pass http://$upstream_core;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # All other API → core
    location /api/ {
        set $upstream_core core:8082;
        proxy_pass http://$upstream_core;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # WebSocket proxy
    location /ws {
        set $upstream_core core:8082;
        proxy_pass http://$upstream_core;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # ★ SPA fallback: all routes → index.html
    # /login, /dashboard, /board/123 → all served by React Router
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        etag off;
        if_modified_since off;
        add_header Last-Modified "";
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
    }
}
