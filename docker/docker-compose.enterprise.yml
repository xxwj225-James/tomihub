services:
  ollama-embed:
    image: ollama/ollama:latest
    container_name: ai-pm-ollama-embed
    volumes:
    - ollama_embed_data:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_HOST: 0.0.0.0
    entrypoint:
    - /bin/sh
    - -c
    command:
    - 'ollama serve &

      sleep 3

      ollama pull bge-m3

      tail -f /dev/null

      '
    networks:
    - ai-pm-net
    restart: unless-stopped
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-pm-postgres
    environment:
      POSTGRES_DB: ai_pm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
    - 5433:5432
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ../supabase/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d ai_pm
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
    - ai-pm-net
  redis:
    image: redis:7-alpine
    container_name: ai-pm-redis
    ports:
    - 6379:6379
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
    networks:
    - ai-pm-net
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ai-pm-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
    - 5672:5672
    - 15672:15672
    volumes:
    - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - check_port_connectivity
      interval: 10s
      timeout: 30s
      retries: 5
    networks:
    - ai-pm-net
  auth:
    build:
      context: ..
      dockerfile: docker/Dockerfile.java
      target: auth
    image: tomihub-auth
    container_name: ai-pm-auth
    ports:
    - 8081:8081
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/ai_pm
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      TZ: Asia/Shanghai
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      ENCRYPT_KEY: ${ENCRYPT_KEY:-TomiHub2026}
      DEMO_EMAIL_SUFFIX: ${DEMO_EMAIL_SUFFIX:-@tomihub.demo}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      ALL_PROXY: ${ALL_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -sf
      - http://localhost:8081/actuator/health
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
    volumes:
    - tomiHub_logs:/var/log/tomiHub
    networks:
    - ai-pm-net
    restart: unless-stopped
  core:
    build:
      context: ..
      dockerfile: docker/Dockerfile.java
      target: core
    image: tomihub-core
    container_name: ai-pm-core
    ports:
    - 8082:8082
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/ai_pm
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      TZ: Asia/Shanghai
      ENCRYPT_KEY: ${ENCRYPT_KEY:-TomiHub2026}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      ALL_PROXY: ${ALL_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth:
        condition: service_healthy
    volumes:
    - tomiHub_logs:/var/log/tomiHub
    healthcheck:
      test:
      - CMD
      - curl
      - -sf
      - http://localhost:8082/actuator/health
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      ai-pm-net:
        mac_address: 02:42:ac:16:00:10
    restart: unless-stopped
  ai-brain-api:
    image: ghcr.io/xxwj225-james/tomihub-brain-api:latest
    container_name: ai-pm-brain-api
    command:
    - api
    ports:
    - 8000:8000
    environment:
      AIPM_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/ai_pm
      AIPM_REDIS_URL: redis://redis:6379/0
      AIPM_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      AIPM_DEBUG: 'true'
      PORT: '8000'
      UVICORN_WORKERS: '2'
      AIPM_JAVA_BACKEND_URL: http://core:8082/api/v1
      AIPM_JAVA_API_KEY: ${AIPM_JAVA_API_KEY:-}
      AIPM_FALLBACK_TENANT_ID: ${AIPM_FALLBACK_TENANT_ID:-}
      AIPM_REDMINE_URL: ${AIPM_REDMINE_URL:-}
      AIPM_REDMINE_API_KEY: ${AIPM_REDMINE_API_KEY:-}
      AIPM_REDMINE_PROJECT_KEYS: ${AIPM_REDMINE_PROJECT_KEYS:-}
      AIPM_REDMINE_TENANT_ID: ${AIPM_REDMINE_TENANT_ID:-}
      AIPM_REDMINE_SYNC_INTERVAL_MINUTES: ${AIPM_REDMINE_SYNC_INTERVAL_MINUTES:-30}
      AIPM_LICENSE_PATH: /var/log/tomiHub/ai-brain.lic
      AIPM_LICENSE_ENFORCE: 'true'
    volumes:
    - tomiHub_logs:/var/log/tomiHub
    - ./ai-brain.lic:/var/log/tomiHub/ai-brain.lic:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
    - ai-pm-net
    restart: unless-stopped
    pull_policy: always
  ai-brain-worker:
    image: ghcr.io/xxwj225-james/tomihub-brain-worker:latest
    container_name: ai-pm-brain-worker
    command:
    - worker
    environment:
      AIPM_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/ai_pm
      AIPM_REDIS_URL: redis://redis:6379/0
      AIPM_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      AIPM_DEBUG: 'true'
      CELERY_CONCURRENCY: '2'
      CELERY_MAX_TASKS: '50'
      CELERY_TASK_TIME_LIMIT: '1800'
      CELERY_SOFT_TIME_LIMIT: '1500'
      AIPM_JAVA_API_KEY: ${AIPM_JAVA_API_KEY:-}
      AIPM_FALLBACK_TENANT_ID: ${AIPM_FALLBACK_TENANT_ID:-}
      AIPM_REDMINE_URL: ${AIPM_REDMINE_URL:-}
      AIPM_REDMINE_API_KEY: ${AIPM_REDMINE_API_KEY:-}
      AIPM_REDMINE_PROJECT_KEYS: ${AIPM_REDMINE_PROJECT_KEYS:-}
      AIPM_REDMINE_TENANT_ID: ${AIPM_REDMINE_TENANT_ID:-}
      AIPM_REDMINE_SYNC_INTERVAL_MINUTES: ${AIPM_REDMINE_SYNC_INTERVAL_MINUTES:-30}
      AIPM_LICENSE_PATH: /var/log/tomiHub/ai-brain.lic
      AIPM_LICENSE_ENFORCE: 'true'
    volumes:
    - tomiHub_logs:/var/log/tomiHub
    - ./ai-brain.lic:/var/log/tomiHub/ai-brain.lic:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
    - ai-pm-net
    restart: unless-stopped
    pull_policy: always
  ai-brain-beat:
    image: ghcr.io/xxwj225-james/tomihub-brain-beat:latest
    container_name: ai-pm-brain-beat
    command:
    - beat
    environment:
      AIPM_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/ai_pm
      AIPM_REDIS_URL: redis://redis:6379/0
      AIPM_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      AIPM_JAVA_API_KEY: ${AIPM_JAVA_API_KEY:-}
      AIPM_FALLBACK_TENANT_ID: ${AIPM_FALLBACK_TENANT_ID:-}
      AIPM_REDMINE_URL: ${AIPM_REDMINE_URL:-}
      AIPM_REDMINE_API_KEY: ${AIPM_REDMINE_API_KEY:-}
      AIPM_REDMINE_PROJECT_KEYS: ${AIPM_REDMINE_PROJECT_KEYS:-}
      AIPM_REDMINE_TENANT_ID: ${AIPM_REDMINE_TENANT_ID:-}
      AIPM_REDMINE_SYNC_INTERVAL_MINUTES: ${AIPM_REDMINE_SYNC_INTERVAL_MINUTES:-30}
      AIPM_LICENSE_PATH: /var/log/tomiHub/ai-brain.lic
      AIPM_LICENSE_ENFORCE: 'true'
    volumes:
    - tomiHub_logs:/var/log/tomiHub
    - ./ai-brain.lic:/var/log/tomiHub/ai-brain.lic:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
    - ai-pm-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import os,sys; procs=[open("/proc/"+x+"/cmdline").read() for x in os.listdir("/proc")
        if x.isdigit()]; sys.exit(0 if any(("celery" in c) and ("beat" in c) for c
        in procs) else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    pull_policy: always
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      target: prod
      args:
        VITE_ENABLE_AI_FEATURES: ${VITE_ENABLE_AI_FEATURES:-true}
        VITE_ENABLE_DEMO_MODE: ${VITE_ENABLE_DEMO_MODE:-false}
        VITE_DEMO_EMAIL_SUFFIX: ${DEMO_EMAIL_SUFFIX:-@tomihub.demo}
    image: tomihub-frontend
    container_name: ai-pm-frontend
    ports:
    - 80:80
    - 443:443
    volumes:
    - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      core:
        condition: service_healthy
    networks:
    - ai-pm-net
volumes:
  postgres_data: null
  redis_data: null
  rabbitmq_data: null
  tomiHub_logs: null
  ollama_embed_data: null
networks:
  ai-pm-net:
    driver: bridge
    enable_ipv6: ${ENABLE_IPV6:-false}
    ipam:
      config:
      - subnet: 172.22.0.0/16
      - subnet: 2001:db8:1::/64
        gateway: 2001:db8:1::1
