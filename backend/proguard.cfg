# ProGuard rules — Spring Boot 3.3 + MyBatis-Plus
# ============================================================
# Strategy: keep all public API (controllers, entities, DTOs, repos)
#           obfuscate everything else (services, utils, internals)

# ─── Spring Boot entry points ────────────────────────────
-keep class com.ai_pm.auth.AuthApplication { public static void main(java.lang.String[]); }
-keep class com.ai_pm.core.CoreApplication { public static void main(java.lang.String[]); }
-keep class com.ai_pm.gateway.GatewayApplication { public static void main(java.lang.String[]); }
-keep class com.ai_pm.tenant.TenantApplication { public static void main(java.lang.String[]); }
-keep class com.ai_pm.notification.NotificationApplication { public static void main(java.lang.String[]); }
-keep class com.ai_pm.webhook.WebhookApplication { public static void main(java.lang.String[]); }

# ─── Spring Framework annotations — NEVER obfuscate these ─
# MethodParameters: Spring MVC binds @RequestParam by reflection name —
# without it every query param fails with "Name for argument not specified"
-keepattributes *Annotation*,Signature,Exceptions,InnerClasses,EnclosingMethod,MethodParameters,RecordComponents
-keepdirectories

# ─── Keep Spring component-scan targets ──────────────────
# (ProGuard does not match meta-annotations, so @RestControllerAdvice /
# @ControllerAdvice must be listed explicitly or their handler mappings
# break after obfuscation.)
-keep @org.springframework.stereotype.Controller class * { *; }
-keep @org.springframework.stereotype.Service class * { *; }
-keep @org.springframework.stereotype.Component class * { *; }
-keep @org.springframework.stereotype.Repository class * { *; }
-keep @org.springframework.context.annotation.Configuration class * { *; }
-keep @org.springframework.boot.context.properties.ConfigurationProperties class * { *; }
-keep @org.springframework.web.bind.annotation.RestControllerAdvice class * { *; }
-keep @org.springframework.web.bind.annotation.ControllerAdvice class * { *; }

# ─── Keep Spring MVC controllers (route methods) ────────
-keep class com.ai_pm.**.controller.** { public *; }

# ─── Keep entities (MyBatis-Plus / Jackson need field names) ─
-keep class com.ai_pm.**.entity.** {
    <fields>;
    public <init>();
    public *;
}

# ─── Keep DTOs / records (serialization) ─────────────────
-keep class com.ai_pm.**.dto.** {
    <fields>;
    public <init>(...);
    public *;
}

# ─── Keep MyBatis mapper interfaces ──────────────────────
-keep interface com.ai_pm.**.repository.** {
    <methods>;
}

# ─── Keep Spring configuration ───────────────────────────
-keep class com.ai_pm.**.config.** { public *; }
-keep class com.ai_pm.**.security.** { public *; }

# ─── Keep common / shared classes ────────────────────────
-keep class com.ai_pm.common.** { *; }

# ─── Keep Lombok generated code ──────────────────────────
-keep class **.entity.** { <init>(...); }

# ─── Keep enums ──────────────────────────────────────────
-keepclassmembers enum * { public static **[] values(); public static ** valueOf(java.lang.String); }

# ─── Keep record accessors ────────────────────────────────
# -keep class ... { *; } does not protect implicit record component
# accessors (code()/message()/data()); Jackson serializes records via
# those accessors, so their names must survive obfuscation.
-keepclassmembers class * extends java.lang.Record { public *** *(); }
-keepclassmembers class com.ai_pm.common.web.ApiResponse {
  public int code();
  public java.lang.String message();
  public java.lang.Object data();
}

# ─── Keep serialization ──────────────────────────────────
-keepnames class * implements java.io.Serializable
-keepclassmembers class * implements java.io.Serializable { static final long serialVersionUID; private static final java.io.ObjectStreamField[] serialPersistentFields; !static !transient <fields>; private void writeObject(java.io.ObjectOutputStream); private void readObject(java.io.ObjectInputStream); java.lang.Object writeReplace(); java.lang.Object readResolve(); }

# ─── Spring Boot specific ────────────────────────────────
-keep class org.springframework.** { *; }
-keep class jakarta.** { *; }
-keep class com.baomidou.** { *; }
-keep class com.fasterxml.** { *; }
-dontwarn org.springframework.**
-dontwarn jakarta.**
-dontwarn com.baomidou.**
-dontwarn com.fasterxml.**
-dontwarn lombok.**
-dontwarn org.slf4j.**
-dontwarn io.jsonwebtoken.**
-dontwarn jdk.internal.**
-dontwarn org.apache.logging.**
-dontwarn javax.**
-dontwarn kotlin.**
-dontwarn reactor.**
-dontwarn io.netty.**
-dontwarn org.hibernate.**
-dontwarn io.micrometer.**
-dontwarn jakarta.mail.**
-dontwarn org.flywaydb.**
-dontwarn io.swagger.**
-dontwarn org.springdoc.**
-dontwarn com.zaxxer.hikari.**
-dontwarn org.mybatis.**
# Third-party deps live in the Spring Boot fat jar at runtime — warnings
# about them are noise. Obfuscation applies to project classes only.
-ignorewarnings

# ─── Keep application.yml / property holders ──────────────
-keep class * implements org.springframework.context.ApplicationContextInitializer { *; }
-keep class * implements org.springframework.boot.SpringApplicationRunListener { *; }

# ─── Optimization ────────────────────────────────────────
# Optimization is DISABLED: ProGuard's partial evaluator throws
# IncompleteClassHierarchyException on Spring controller code with jmods
# libraries. Shrinking + obfuscation alone is enough for IP protection —
# optimization only saves a few percent of jar size.
-dontoptimize
-optimizationpasses 1
-dontusemixedcaseclassnames
-verbose
