spring:
  flyway:
    enabled: false
  sql:
    init:
      mode: never
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

management:
  health:
    mail:
      enabled: false

logging:
  level:
    com.ai_pm: INFO
